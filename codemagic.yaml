# Codemagic workflows for dji2 (Android only). Every build is started by hand: there are no
# triggers on purpose, because all macOS builds draw from the same free monthly quota
# (500 min on the personal plan). Linux and Windows machines have no free minutes,
# so mac_mini_m2 is the only instance type used here. Do not switch it without billing enabled.
# No secrets live in this file: the signing key is a keystore uploaded to Codemagic
# (Teams > Code signing identities > Android keystores).
workflows:
  android-verify:
    name: dji2 Android - unit tests and debug APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Unit tests
        script: ./gradlew :app:testSimDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug
        script: ./gradlew :app:assembleSimDebug --no-daemon --stacktrace
    artifacts:
      - '**/build/outputs/apk/**/*.apk'
      - '**/build/test-results/**/*.xml'

  # Release build. Manual only. Nothing is published to Google Play from here.
  android-release:
    name: dji2 Android - release (unsigned release APK)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build release
        script: ./gradlew :app:assembleSimRelease --no-daemon --stacktrace
    artifacts:
      - '**/build/outputs/apk/**/*.apk'
    # Publishing to Google Play is deliberately absent. When a Play service account exists,
    # add a `publishing: google_play:` block here with credentials from a Codemagic variable group.
    # publishing:
    #   google_play:
    #     credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true
